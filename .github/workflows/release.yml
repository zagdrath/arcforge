name: Release

# Pushing a version tag (git tag -a v1.3.0 -m "Arcforge 1.3.0" && git push origin v1.3.0) builds that
# commit, checks it, and publishes a GitHub Release with the jar and that version's changelog section.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The tag must match mod_version, so v1.3.0 can't ship a jar built as 1.2.0.
      - name: Check the tag matches mod_version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "Tag: ${GITHUB_REF_NAME}, mod_version: ${mod_version}"
          if [ "${tag_version}" != "${mod_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match mod_version=${mod_version} in gradle.properties"
            exit 1
          fi
          echo "VERSION=${mod_version}" >> "$GITHUB_ENV"

      # The release notes are the version's section of CHANGELOG.md, which must exist.
      - name: Extract release notes
        run: |
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            index($0, "[") == 1 && index($0, "]: ") > 0 { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          cat release-notes.md

      - name: Build
        run: ./gradlew build

      - name: Run game tests
        run: ./gradlew runGameTestServer

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/*.jar \
            --title "Arcforge ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
