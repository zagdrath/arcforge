name: Release

# Pushing a version tag, v<mod_version>+<minecraft_version> (git tag -a v2.6.0+26.3 -m "Arcforge 2.6.0 for Minecraft
# 26.3" && git push origin v2.6.0+26.3), builds that commit, checks it, publishes a GitHub Release with the mod jar,
# the API jar and that version's changelog section, then uploads the mod jar and notes to CurseForge (project
# 1714407). The API jar isn't uploaded to CurseForge.
# Each Minecraft version has its own branch (main for the newest, mc/<major.minor> for the others), and its tags are
# cut from it. A tag with a pre-release part (v2.6.0-beta.1+26.3) is published as a pre-release. See
# docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minecraft: ${{ steps.version.outputs.minecraft }}
      jar: ${{ steps.version.outputs.jar }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The tag must be v<mod_version>+<minecraft_version>, so v2.6.0+26.3 can't ship a jar built as 2.5.0, or one built
      # from another Minecraft version's branch. The API jar's version is ArcforgeApi.API_VERSION plus the Minecraft
      # version (1.1.0+26.3), read the same way build.gradle reads it.
      - name: Check the tag matches mod_version and minecraft_version
        id: version
        run: |
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          minecraft_version="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          api_version="$(grep -oE 'API_VERSION = "[^"]+"' src/api/java/net/zagdrath/arcforge/api/ArcforgeApi.java \
            | head -n1 | cut -d'"' -f2)"
          expected="v${mod_version}+${minecraft_version}"
          echo "Tag: ${GITHUB_REF_NAME}, expected: ${expected}, API_VERSION: ${api_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match ${expected} (mod_version and minecraft_version in gradle.properties)"
            exit 1
          fi
          if [ -z "${api_version}" ]; then
            echo "::error::Couldn't read API_VERSION from ArcforgeApi.java"
            exit 1
          fi
          echo "MINECRAFT=${minecraft_version}" >> "$GITHUB_ENV"
          echo "VERSION=${mod_version}" >> "$GITHUB_ENV"
          echo "JAR=build/libs/arcforge-${mod_version}+${minecraft_version}.jar" >> "$GITHUB_ENV"
          echo "API_JAR=build/libs/arcforge-api-${api_version}+${minecraft_version}.jar" >> "$GITHUB_ENV"
          echo "version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "minecraft=${minecraft_version}" >> "$GITHUB_OUTPUT"
          echo "jar=arcforge-${mod_version}+${minecraft_version}.jar" >> "$GITHUB_OUTPUT"

      # The release notes are the version's section of CHANGELOG.md, which must be dated, without its
      # "Suggested version" line, with an Unreleased section above it and with its compare links.
      - name: Check CHANGELOG.md and extract release notes
        run: |
          bash .github/scripts/release-notes.sh "${VERSION}" "${MINECRAFT}" CHANGELOG.md release-notes.md
          cat release-notes.md

      - name: Build
        run: ./gradlew build

      - name: Run game tests
        run: ./gradlew runGameTestServer

      - name: Check the jars were built
        run: |
          missing=0
          for jar in "${JAR}" "${API_JAR}"; do
            if [ ! -f "${jar}" ]; then
              echo "::error::${jar} wasn't built"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "build/libs has:"
            ls build/libs
            exit 1
          fi

      # The GitHub Release's notes are the changelog section plus a line saying which jar is which; CurseForge gets
      # release-notes.md alone, since only the mod jar goes there.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat release-notes.md
            echo
            echo "---"
            echo
            echo "**$(basename "${JAR}")** is the mod: put this in your mods folder. **$(basename "${API_JAR}")** is the API for mod developers to compile against: don't install it."
          } > github-notes.md
          prerelease=()
          case "${VERSION}" in *-*) prerelease=(--prerelease) ;; esac
          # Only main's full releases (the newest Minecraft version) are marked latest, not backports or pre-releases.
          latest=(--latest=false)
          if [ "${#prerelease[@]}" -eq 0 ] && git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then latest=(--latest); fi
          gh release create "${GITHUB_REF_NAME}" "${JAR}" "${API_JAR}" \
            --title "Arcforge ${VERSION} for Minecraft ${MINECRAFT}" \
            --notes-file github-notes.md \
            --verify-tag \
            "${prerelease[@]}" "${latest[@]}"

      # The mod jar and notes the curseforge job uploads, so it sends exactly what the GitHub Release has (the API
      # jar stays on GitHub only).
      - name: Gather the jar and release notes
        run: |
          mkdir release-files
          cp "${JAR}" release-notes.md release-files/

      - name: Keep the jar and release notes for CurseForge
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  # A job of its own, so if CurseForge rejects the upload, "Re-run failed jobs" retries only this.
  curseforge:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get the jar and release notes
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      # Pre-release versions (2.6.0-beta.1+26.3) go up as beta files. The token is the CURSEFORGE_TOKEN repository secret.
      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/curseforge_upload.py \
            --project 1714407 \
            --jar "release-files/${{ needs.release.outputs.jar }}" \
            --notes release-files/release-notes.md \
            --version "${{ needs.release.outputs.version }}" \
            --minecraft "${{ needs.release.outputs.minecraft }}" \
            --java 25 \
            --optional jei,jade
