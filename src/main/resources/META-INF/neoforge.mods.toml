license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Zagdrath"
# Square icon in the mod list, banner on the mod details screen.
iconFile="arcforge_icon.png"
iconBlur=false
bannerFile="arcforge_banner.png"
description='''
Arcforge is a technology mod built on Forge Energy (FE), compatible with any NeoForge mod that uses the standard energy, fluid and item capabilities.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Hibiscus Quests loads the questline in data/arcforge/hibiscusquests; without it those files are unused.
[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[17.0.0-beta.3+26.3,18.0.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="hibiscusquests"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"
